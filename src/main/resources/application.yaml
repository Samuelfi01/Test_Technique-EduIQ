spring:
  application:
    name: demo

  # Configuration de la base de données H2 (en mémoire)
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 

  # Configuration JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    # Important pour charger data.sql APRES la création des tables
    defer-datasource-initialization: true

  # Activation du script data.sql
  sql:
    init:
      mode: always

  # Console H2 pour voir tes données dans le navigateur
  h2:
    console:
      enabled: true
      path: /h2-console