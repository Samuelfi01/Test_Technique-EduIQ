<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Effectif des Apprentis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 30px; background-color: #f8fafc; }
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        th { 
            background-color: #f0fdf4; 
            color: #166534; 
            text-align: left; 
            padding: 16px; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            border-bottom: 2px solid #dcfce7;
        }

        td { 
            padding: 16px; 
            border-bottom: 1px solid #f1f5f9; 
            color: #334155;
        }

        .diploma-badge { 
            background-color: #dcfce7; 
            color: #166534; 
            padding: 4px 12px; 
            border-radius: 12px; 
            font-size: 0.8rem; 
            font-weight: 600; 
        }
        
        .back-link { color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header-box">
        <h2 style="font-weight: 700; color: #1e293b; margin: 0;">Effectif des Apprentis</h2>
        <a href="/" class="back-link">← Retour au menu</a>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 30%;">Apprenti</th>
                <th style="width: 25%;">Diplôme</th>
                <th style="width: 20%;">Date de Naissance</th>
                <th style="width: 25%;">NIR</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${apprentis}">
                <td>
                    <span style="font-weight: 600;" th:text="${a.nom}"></span> 
                    <span style="text-transform: uppercase; color: #64748b; font-size: 0.85rem;" th:text="${a.prenom}"></span>
                </td>
                <td><span class="diploma-badge" th:text="${a.niveauDiplome}"></span></td>
                <td th:text="${a.dateNaissance}"></td>
                <td style="font-family: monospace; color: #64748b;" th:text="${a.nir}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
