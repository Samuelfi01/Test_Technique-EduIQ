<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registre des Entreprises</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 30px; background-color: #f8fafc; }
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        th { 
            background-color: #f1f5f9; 
            color: #475569; 
            text-align: left; 
            padding: 16px; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            letter-spacing: 0.05em;
            border-bottom: 2px solid #e2e8f0;
        }

        td { 
            padding: 16px; 
            border-bottom: 1px solid #f1f5f9; 
            color: #334155;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #fdfdfd; }

        .siret-code { font-family: monospace; color: #6366f1; background: #eef2ff; padding: 2px 6px; border-radius: 4px; }
        .back-link { color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header-box">
        <h2 style="font-weight: 700; color: #1e293b; margin: 0;">Registre des Entreprises</h2>
        <a href="/" class="back-link">← Retour au menu</a>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 30%;">Raison Sociale</th>
                <th style="width: 25%;">SIRET</th>
                <th style="width: 15%;">Effectif</th>
                <th style="width: 30%;">Adresse</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${entreprises}">
                <td style="font-weight: 600;" th:text="${c.raisonSociale}"></td>
                <td><span class="siret-code" th:text="${c.siret}"></span></td>
                <td>
                    <span style="background: #f1f5f9; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem;" 
                          th:text="${c.effectif}"></span>
                </td>
                <td style="color: #64748b;" th:text="${c.adresse}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
