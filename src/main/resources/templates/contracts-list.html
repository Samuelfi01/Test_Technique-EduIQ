<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suivi des Contrats</title>
    <!-- On garde Bootstrap au cas où il finirait par charger -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f7f9; }
        
        /* On force la séparation même sans Bootstrap */
        table { 
            width: 100%; 
            border-collapse: collapse; /* Évite les doubles bordures */
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th { 
            background-color: #fffbeb; 
            color: #92400e; 
            text-align: left; 
            padding: 15px; /* C'est ça qui crée l'espace ! */
            border-bottom: 2px solid #fbbf24;
            text-transform: uppercase;
            font-size: 12px;
        }

        td { 
            padding: 15px; /* Espace à l'intérieur des cellules */
            border-bottom: 1px solid #e2e8f0; 
            vertical-align: middle;
        }

        tr:hover { background-color: #f8fafc; }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px;">Suivi des Contrats</h2>
    <a href="/" style="display: inline-block; margin-bottom: 20px; color: #64748b;">← Retour Menu</a>

    <table>
        <thead>
            <tr>
                <th style="width: 20%;">Type</th>
                <th style="width: 35%;">Période de validité</th>
                <th style="width: 20%;">Rémunération</th>
                <th style="width: 25%;">Statut du dossier</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="con : ${contrats}">
                <td th:text="${con.type}" style="font-weight: bold;"></td>
                <td>
                    Du <span th:text="${con.dateDebut}"></span> 
                    au <span th:text="${con.dateFin}"></span>
                </td>
                <td style="color: #2563eb; font-weight: bold;">
                    <span th:text="${con.remuneration}"></span> €
                </td>
                <td>
                    <span class="badge" th:text="${con.statut}"></span>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
